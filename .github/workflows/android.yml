name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "28.2.13676358"
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  apk:
    name: Build Recoder APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK and install NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "Using ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            echo "PATH=$(dirname "${SDKMANAGER}"):${SDK_ROOT}/platform-tools:$HOME/.cargo/bin:${PATH}"
          } >> "$GITHUB_ENV"

      - name: Install Dioxus CLI
        run: |
          curl -sSL "https://github.com/DioxusLabs/dioxus/releases/download/v${DIOXUS_CLI_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$HOME/.cargo/bin"
          dx --version
          echo "NDK_HOME=${NDK_HOME}" && ls "${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -3

      - name: Run core tests
        run: cargo test -p recoder-core

      - name: Build release APK
        # The CLI targets the host architecture when no device is attached, so
        # the phone ABI has to be named explicitly.
        run: dx bundle --platform android --release --package-types apk --target aarch64-linux-android

      - name: Locate APK
        run: |
          find . -name "*.apk" -type f | tee apk-paths.txt
          test -s apk-paths.txt || (echo "No APK produced" && exit 1)
          while read -r apk; do ls -lh "$apk"; unzip -l "$apk" | grep "lib/" || true; done < apk-paths.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: recoder-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
