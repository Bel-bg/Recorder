name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "28.2.13676358"
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  apk:
    name: Build Recoder APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK and install NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          echo "Using ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            echo "PATH=$(dirname "${SDKMANAGER}"):${SDK_ROOT}/platform-tools:$HOME/.cargo/bin:${PATH}"
          } >> "$GITHUB_ENV"

      - name: Install Dioxus CLI
        run: |
          curl -sSL "https://github.com/DioxusLabs/dioxus/releases/download/v${DIOXUS_CLI_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$HOME/.cargo/bin"
          dx --version

      - name: Run core tests
        run: cargo test -p recoder-core

      - name: Build release APK
        # The CLI targets the host architecture when no device is attached, so
        # the phone ABI has to be named explicitly.
        run: dx bundle --platform android --release --package-types apk --target aarch64-linux-android

      - name: Locate APK
        id: apk
        run: |
          APK="$(find target/dx -name '*.apk' -type f | head -1)"
          test -n "${APK}" || (echo "No APK produced" && exit 1)
          ls -lh "${APK}"
          unzip -l "${APK}" | grep "lib/" || true
          echo "path=${APK}" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=Recoder-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Stage release asset
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.version.outputs.asset }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recoder-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Recoder ${{ steps.version.outputs.tag }}
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.asset }}
          body: |
            APK Android de Recoder, compilé automatiquement depuis la branche main.

            Installation sur le téléphone :
            1. Téléchargez le fichier APK ci-dessous.
            2. Ouvrez-le depuis les téléchargements du téléphone.
            3. Autorisez l'installation depuis cette source si Android le demande.

            L'APK est destiné aux tests personnels, il n'est pas signé pour le Play Store.
            Recoder nécessite Android 8.0 ou plus récent et un microphone.
